# CI: the full suite with coverage (code.md rule 8, d-0119), on every OS Forge ships for.
# Every push and PR runs Windows only, the main platform; Linux and macOS run once a day
# (and on demand) because the org is on GitHub Free, where macOS minutes count about 10x (d-0120).
# Live probes never run here: they skip themselves unless FORGE_PROBES=1, which is not set.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 17:30 UTC = 23:00 IST, end of the working day.
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["windows-latest","macos-latest","ubuntu-latest"]' || '["windows-latest"]') }}
    steps:
      # Before checkout: Windows runners default to autocrlf=true, which would turn LF files
      # into CRLF and fail `prettier --check` and byte-exact test fixtures.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # Tests build fixture repos and commit in them without setting an identity.
      - name: Configure git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
