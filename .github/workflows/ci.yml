# CI: the full suite with coverage (code.md rule 8, d-0119), on every OS Forge ships for.
# The repository is public, so standard GitHub-hosted runners cost nothing (d-0125):
#   push to main / pull request (code changes only) -> Windows, macOS and Linux
#   manual run (workflow_dispatch)                   -> the same three
# Docs-only changes (markdown, docs/, project memory) do not run CI.
# Live probes never run here: they skip themselves unless FORGE_PROBES=1, which is not set.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.forge/memory/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.forge/memory/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      # Before checkout: Windows runners default to autocrlf=true, which would turn LF files
      # into CRLF and fail `prettier --check` and byte-exact test fixtures.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # Tests build fixture repos and commit in them without setting an identity.
      - name: Configure git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
