# Mirror of the built-in tool catalogue (version 1). The server does not read this file:
# the catalogue lives in the database and is edited in Settings (d-0085). A test pins this
# file equal to the seed in packages/tools/src/domain/catalogue-seed-*.ts. Native tools carry
# no schema_hash: each harness build's schemas are approved per build (d-0088).
entries:
  - id: read
    kind: harness-native
    version: "1"
    risk: read
    exposure: direct
    resources:
      - cwd
    support:
      claude-code:
        native: Read
        mechanism: allow-flag
        enforced: harness
  - id: glob
    kind: harness-native
    version: "1"
    risk: read
    exposure: direct
    resources:
      - cwd
    support:
      claude-code:
        native: Glob
        mechanism: allow-flag
        enforced: harness
  - id: grep
    kind: harness-native
    version: "1"
    risk: read
    exposure: direct
    resources:
      - cwd
    support:
      claude-code:
        native: Grep
        mechanism: allow-flag
        enforced: harness
  - id: edit
    kind: harness-native
    version: "1"
    risk: write-cwd
    exposure: direct
    resources:
      - cwd
    support:
      claude-code:
        native: Edit
        mechanism: allow-flag
        enforced: harness
  - id: write
    kind: harness-native
    version: "1"
    risk: write-cwd
    exposure: direct
    resources:
      - cwd
    support:
      claude-code:
        native: Write
        mechanism: allow-flag
        enforced: harness
  - id: shell
    kind: harness-native
    version: "1"
    risk: exec
    exposure: direct
    resources:
      - cwd
    support:
      claude-code:
        native:
          - Bash
          - PowerShell
        mechanism: allow-flag
        enforced: harness
  - id: task
    kind: harness-native
    version: "1"
    risk: exec
    exposure: hidden
    reaches_tools:
      - read
      - glob
      - grep
      - edit
      - write
      - shell
    resources:
      - cwd
    support:
      claude-code:
        native:
          - Task
          - Agent
        mechanism: allow-flag
        enforced: harness
  - id: mcp__forge__get_ticket
    kind: factory-core
    version: "1"
    risk: read
    exposure: direct
    schema_hash: sha256:af8b696c68738b8d43df0027a45c18d4431adeda8618fb440d51caa13b5389d4
    support:
      "*":
        mechanism: mcp
        enforced: server
  - id: mcp__forge__add_comment
